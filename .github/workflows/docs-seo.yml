name: Docs SEO

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r scripts/requirements-seo.txt
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/test_*.cjs
      - run: python3 scripts/check_docs_seo.py
      - run: npx --yes mintlify@4.2.1059 validate
      - run: npx --yes mintlify@4.2.1059 broken-links --check-anchors --check-redirects
